[package]
name = "infomentor-mcp"
# Kept equal to packages/infomentor-mcp/package.json; a test compares them.
version = "0.8.0"
description = "Local MCP server for Icelandic InfoMentor parent accounts with direct HTTP login"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test seam only: INFOMENTOR_TEST_ORIGIN sends requests (never cookies or the URLs the code sees)
# to a local fake upstream. Off by default, so a release build always talks to InfoMentor itself.
test-origin = []

[dependencies]
family-store = { path = "../family-store" }
mcp-runtime = { path = "../mcp-runtime" }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["rt", "io-std", "macros", "signal", "sync", "time"] }

[dev-dependencies]
# Its unit tests open scratch stores in their own process, with the store test seam on.
family-store = { path = "../family-store", features = ["test-seam"] }
