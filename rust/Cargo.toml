[workspace]
resolver = "3"
members = ["family-store", "mcp-runtime", "abler-mcp", "kronan-mcp", "infomentor-mcp"]

[workspace.package]
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Smallest shipping binary; measured in the pilot report.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
