[package]
name = "vedur-mcp"
version = "0.1.1"
description = "Read-only Icelandic weather MCP server for Veðurstofa Íslands (IMO) forecasts, observations and warnings"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Loopback fake upstream only; release builds never enable it.
test-origin = []

[dependencies]
# Already linked through rmcp; used for fetched_at and the CAP and RSS timestamps.
chrono = { version = "=0.4.45", default-features = false, features = ["now"] }
mcp-runtime = { path = "../mcp-runtime" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server"] }
# The vaktin RSS feed; rejects DTDs by default.
roxmltree = "=0.21.1"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["rt", "macros", "sync", "time"] }
