name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a matching existing version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.REF_TYPE, 'tag', 'Select an existing release tag.');
          assert.equal(process.env.RELEASE_TAG, `v${version}`);
          assert.ok(readFileSync('install.sh', 'utf8').includes(`INFOMENTOR_VERSION:-${version}`));
          NODE
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
  draft:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'release-*' --dir artifacts
      - name: Write release notes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const repository = process.env.GITHUB_REPOSITORY;
          writeFileSync('release-notes.md', [
            `InfoMentor MCP ${version} (preview)`, '',
            'Login, session import, browser installation, progress, cancellation, logout, session checks, and the parent-page overview are available through MCP.', '',
            'Install the prebuilt command on macOS/Linux (Node.js included):', '',
            '```sh', `curl -fsSL https://raw.githubusercontent.com/${repository}/v${version}/install.sh | sh`, '```', '',
            'Or install the npm tarball using an existing Node.js 22+ runtime:', '',
            '```sh', `npm install --global --ignore-scripts https://github.com/${repository}/releases/download/v${version}/infomentor-mcp-${version}.tgz`, '```', '',
            'Browser checks passed in Chromium, Firefox, and WebKit on Node 22 and 24. Native macOS/Linux x64/arm64 installers passed CLI and MCP checks, including checksum failure and reinstalls.', '',
            '**Preview limitation:** real parent-account compatibility has not yet been verified. Only session status and visible landing-page data are currently provided; structured child/schedule/homework/attendance/grades tools are not implemented.', '',
            'The npm registry has not been published to. Each archive has a SHA-256 checksum. Browser binaries are installed separately through MCP.', '',
            `Setup guide: https://github.com/${repository}/blob/v${version}/README.md`,
          ].join('\n'));
          NODE
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/release-*/* install.sh --draft --prerelease --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
