name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build check test
      - run: bun audit
      - run: npm pack
        working-directory: packages/abler-mcp
      - name: Install the Abler archive without lifecycle scripts
        working-directory: packages/abler-mcp
        run: npm install --global --prefix "$RUNNER_TEMP/abler" --ignore-scripts "./abler-mcp-$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version').tgz"
      - name: Verify the installed Abler Node executable over MCP stdio
        working-directory: packages/abler-mcp
        run: bun test/pack-smoke.ts "$RUNNER_TEMP/abler/bin/abler-mcp"
      - run: bun pm pack
        working-directory: packages/infomentor-mcp
      - run: bun run test:package
        working-directory: packages/infomentor-mcp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == 24
        with:
          name: release-npm
          path: |
            packages/*/*.tgz
            packages/*/*.tgz.sha256
          if-no-files-found: error

  standalone:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx turbo run test
      - run: bun run build:native
        working-directory: packages/abler-mcp
      - name: Verify Abler without Node, Bun, or the source checkout at runtime
        working-directory: packages/abler-mcp
        run: bun test/pack-smoke.ts release/native/abler-mcp --standalone
      - run: bun pm pack
        working-directory: packages/infomentor-mcp
      - run: bun run build:binary
        working-directory: packages/infomentor-mcp
      - run: bun run test:installer
        working-directory: packages/infomentor-mcp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.runner }}
          path: |
            packages/*/release/*.tar.gz
            packages/*/release/*.sha256
          if-no-files-found: error
          retention-days: 7
